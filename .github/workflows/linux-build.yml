name: Linux builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-test:
    name: FindWhat — ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        container:
          - debian:13

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            file \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            libpoppler-cpp-dev \
            libxkbcommon-dev \
            libpoppler-qt6-dev \
            catch2

      - name: Check installed versions
        run: |
          cmake --version
          pkg-config --modversion Qt6Core
          pkg-config --modversion poppler-qt6

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
        if: ${{ hashFiles('tests/**', 'test/**') != '' }}
      
      - name: Inspect executable
        run: |
          test -x build/bin/FindWhat
          ldd build/bin/FindWhat
      
      - name: Stage installation
        run: |
          rm -rf package
          DESTDIR="$PWD/package" cmake --install build
          find package -type f -print
      
      - name: Upload installed package
        uses: actions/upload-artifact@v4
        with:
          name: FindWhat-${{ matrix.name }}
          path: package/
          if-no-files-found: error
